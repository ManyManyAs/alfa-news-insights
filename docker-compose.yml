services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        EMBEDDINGS: ${EMBEDDINGS:-false}
    image: alfa-news-insights:latest
    ports:
      # только localhost: на сервере наружу отдаёт Nginx (docker в обход ufw публикует порты на 0.0.0.0)
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /app/data/processed/app.db
    volumes:
      # свои CSV (необязательно; по умолчанию используются данные кейса из data/case)
      - ./data/raw:/app/data/raw:ro
      # БД, кэш LLM, демо-пользователи
      - ./data/processed:/app/data/processed
      # OCR-тексты аналитики банка (scripts/extract_bank_theses.py)
      - ./data/knowledge:/app/data/knowledge
    restart: unless-stopped

  tests:
    profiles: ["test"]
    image: alfa-news-insights:latest
    command: ["python", "-m", "pytest", "-q"]
    environment:
      LLM_MODE: mock
      USE_SNAPSHOT: "false"
