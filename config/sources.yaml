# Расписание фонового сбора (минуты); первый проход — сразу после старта
schedule_minutes: 30
# Не больше N свежих заметок из одного источника за проход (бюджет и нагрузка)
max_per_source: 40

# Прогрев: после каждого сбора заранее строить разборы верха ленты каждой демо-персоны (только с живыми моделями,
# приоритет «фон» — не трогает резерв бюджета под пользователей). Готовые разборы моделью не пересобираются.
prewarm_enabled: true
prewarm_top: 6
# остальные роли каждой персоны: верх ленты (смена роли в демо тоже открывает готовый разбор)
prewarm_roles_top: 2
prewarm_max_rub: 20
prewarm_max_minutes: 10
