# Источники новостей. Новый источник = новая запись (адаптер type: rss (RSS 2.0 и Atom) | jsonl).
# Сохраняем только заголовок, лид, ссылку и дату — полный текст не перепубликуется; карточка всегда ведёт
# на первоисточник. Перед включением проверьте robots.txt и условия использования источника.
#
# trust — уровень доверия, влияет на обработку и показывается в UI:
#   official — регулятор и органы власти: всегда разбирается моделью, фильтр шума не применяется;
#   agency   — информагентства (быстро, фактологично);
#   media    — деловые СМИ (контекст, мнения, прогнозы — их сервис помечает как предположения);
#   demo     — синтетический демо-набор для проверки без интернета.
# Работоспособность каждого источника видна в UI («Источники») и на /api/sources/health.

sources:
