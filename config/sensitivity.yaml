# Линза роли: множители к весам факторов (крит. «персонализация по роли»)
roles:
  owner:
    title: Собственник
    multipliers: {geopolitics: 1.3, budget_policy: 1.2, tax_regulation: 1.2, consumer_demand: 1.2}
  ceo:
    title: Генеральный директор
    multipliers: {consumer_demand: 1.3, labor_market: 1.2, sanctions_trade: 1.2}
  cfo:
    title: Финансовый директор
    multipliers: {key_rate: 1.4, credit_conditions: 1.3, fx_rub: 1.3, bond_market: 1.2, inflation: 1.2}
  treasurer:
    title: Казначей
    multipliers: {key_rate: 1.5, fx_rub: 1.5, bond_market: 1.4, china_trade: 1.3}
  accountant:
    title: Главный бухгалтер
    multipliers: {tax_regulation: 1.8, budget_policy: 1.1}

# Базовый вес фактора для всех компаний (макрофон важен всем понемногу)
baseline:
  key_rate: 0.2
  inflation: 0.3
  fx_rub: 0.2
  consumer_demand: 0.1
  tax_regulation: 0.2
