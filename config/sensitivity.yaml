# Матрица чувствительности: признак компании -> фактор -> вес и знак.
#
# weight  — насколько фактор важен компании (0..1), суммируется по правилам.
# sign    — как РОСТ фактора влияет на компанию: +1 хорошо, -1 плохо, 0 неоднозначно.
#           Итоговый эффект = sign * direction события (up=+1, down=-1).
# why     — шаблон объяснения «почему вам это важно» (показывается в UI и
#           передаётся агенту как обоснование из профиля).
#
# Новая отрасль или продукт = новая строка, без изменения кода (критерий 07).

products:
  CL_PRODUCT_LOA_MARK:
    title: Кредит
    exposures:
      - {factor: key_rate, weight: 1.0, sign: -1, why: "У компании есть кредит в банке — изменение ставки напрямую меняет процентную нагрузку"}
      - {factor: credit_conditions, weight: 0.6, sign: 1, why: "Компания пользуется кредитом — важны условия рефинансирования и доступность заёмных средств"}
  CL_PRODUCT_DEP_MARK:
    title: Депозит
    exposures:
      - {factor: key_rate, weight: 0.7, sign: 1, why: "У компании есть депозиты — ставка определяет доходность свободной ликвидности"}
  CL_PRODUCT_LEA_MARK:
    title: Лизинг
    exposures:
      - {factor: key_rate, weight: 0.6, sign: -1, why: "Лизинговые платежи зависят от стоимости фондирования"}
      - {factor: auto_market, weight: 0.5, sign: 0, why: "Компания использует лизинг — важны цены и условия на рынке техники и авто"}
  CL_PRODUCT_ZPP_MARK:
    title: Зарплатный проект
    exposures:
      - {factor: labor_market, weight: 0.6, sign: -1, why: "У компании зарплатный проект — дефицит кадров и рост зарплат увеличивают ФОТ"}
  CL_PRODUCT_GAR_MARK:
    title: Гарантии
    exposures:
      - {factor: budget_policy, weight: 0.6, sign: 1, why: "Компания использует банковские гарантии — вероятно, работает с госзаказом, важны бюджетные решения"}
  FACTORING_MARK:
    title: Факторинг
    exposures:
      - {factor: credit_conditions, weight: 0.5, sign: 1, why: "Компания пользуется факторингом — важны отсрочки и платёжная дисциплина покупателей"}
      - {factor: consumer_demand, weight: 0.3, sign: 1, why: "Факторинг обычно связан с поставками в розницу — важен спрос"}
  FTS_FLAG:
    title: Внешнеэкономическая деятельность
    exposures:
      - {factor: fx_rub, weight: 0.9, sign: 0, why: "Компания ведёт ВЭД — курс рубля влияет на стоимость контрактов (для импортёра ослабление рубля — риск, для экспортёра — возможность)"}
      - {factor: sanctions_trade, weight: 0.8, sign: -1, why: "Компания ведёт ВЭД — санкции, пошлины и ограничения меняют условия поставок и расчётов"}
      - {factor: logistics, weight: 0.5, sign: -1, why: "Компания ведёт ВЭД — важны сроки и стоимость международной логистики"}

# Страна ВЭД -> дополнительный фактор
countries:
  КИТАЙ: [{factor: china_trade, weight: 0.8, sign: 0, why: "Компания торгует с Китаем — важны расчёты в юанях и курс CNY"}]
  ГОНКОНГ: [{factor: china_trade, weight: 0.6, sign: 0, why: "Компания работает через Гонконг — важны расчёты в юанях"}]
  ТУРЦИЯ: [{factor: sanctions_trade, weight: 0.3, sign: -1, why: "Компания работает с Турцией — чувствительна к вторичным санкциям и проблемам с платежами"}]
  ОАЭ: [{factor: sanctions_trade, weight: 0.3, sign: -1, why: "Компания работает с ОАЭ — чувствительна к платёжной инфраструктуре и санкционным рискам"}]

