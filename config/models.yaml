# Роутинг задач по разрешённым моделям (Приложение 3 кейса).
# Использовать другие LLM запрещено — клиент проверяет, что model id входит в allowed.
#
# id моделей — точно как в инструкции организаторов (эндпоинт https://changellenge.up.railway.app/v1).
# scripts/llm_check.py сверяет их со списком /models эндпоинта.
# Переопределение без правки файла: env LLM_MODEL_GEMMA, LLM_MODEL_GLM, LLM_MODEL_QWEN, LLM_MODEL_DEEPSEEK,
# LLM_MODEL_QWEN_VL, LLM_MODEL_KIMI.
# price_rub_per_1k_* — оценка для учёта дневного лимита 500 ₽ (уточнить у организаторов).

daily_budget_rub: 500
# Бюджет организаторов сбрасывается в 03:00 МСК
budget_reset_hour_msk: 3
# Доля бюджета, после которой включается экономичный режим (дешёвые модели + шаблоны)
soft_limit_share: 0.8
# Фоновые задачи (предрасчёт) не тратят больше этой доли — остаток резервируется под запросы пользователей
background_share: 0.6

models:
  gemma:
    id: "google/gemma-4-26b-a4b-it"
    title: Gemma 4 26B A4B
    price_rub_per_1k_input: 0.02
    price_rub_per_1k_output: 0.06
  glm:
    id: "z-ai/glm-5.3-flash"
    title: GLM-5.3-Flash
    # «думающая» модель: просим не тратить токены на скрытые рассуждения (если эндпоинт не поддержит — запрос повторится без параметра)
    extra: {reasoning: {enabled: false}}
    price_rub_per_1k_input: 0.05
    price_rub_per_1k_output: 0.15
  qwen:
    id: "qwen/qwen3.6-35b-a3b"
    title: Qwen3.6 35B A3B
    # «думающая» модель: просим не тратить токены на скрытые рассуждения (если эндпоинт не поддержит — запрос повторится без параметра)
    extra: {reasoning: {enabled: false}}
    price_rub_per_1k_input: 0.03
    price_rub_per_1k_output: 0.09
  deepseek:
    id: "deepseek/deepseek-v4.1-flash"
    title: DeepSeek-V4.1-Flash
    # «думающая» модель: просим не тратить токены на скрытые рассуждения (если эндпоинт не поддержит — запрос повторится без параметра)
    extra: {reasoning: {enabled: false}}
    price_rub_per_1k_input: 0.04
    price_rub_per_1k_output: 0.12
  qwen_vl:
    id: "qwen/qwen3-vl-30b-a3b-instruct"
    title: Qwen3-VL-30B-A3B-Instruct
    price_rub_per_1k_input: 0.04
    price_rub_per_1k_output: 0.12
  kimi:
    id: "moonshotai/kimi-k2.6"
    title: Kimi-K2.6
    # «думающая» модель: просим не тратить токены на скрытые рассуждения (если эндпоинт не поддержит — запрос повторится без параметра)
    extra: {reasoning: {enabled: false}}
    price_rub_per_1k_input: 0.05
    price_rub_per_1k_output: 0.15

# Задача -> модель (и запасная модель при исчерпании soft limit)
tasks:
  classify_news:      {model: gemma,    fallback: gemma}
  rerank:             {model: gemma,    fallback: gemma}
  screen_check:       {model: qwen,     fallback: glm}       # вторая модель подтверждает «не про компанию»
  hidden_effects:     {model: deepseek, fallback: qwen}      # неочевидные последствия для компании
  hidden_check:       {model: glm,      fallback: qwen}      # независимая проверка неочевидных последствий
  dedup_arbiter:      {model: gemma,    fallback: glm}
  summarize_doc:      {model: kimi,     fallback: qwen}
  ocr_page:           {model: qwen_vl,  fallback: qwen_vl}
  event_brief:        {model: deepseek, fallback: qwen}
  # Весь агент разбора — DeepSeek: план, черновик, самопроверка и правка.
  # Эксперимент 24.10 (docs/llm/deepseek_only.md, 12 пар разборов, независимые судьи): «только DeepSeek» не хуже
  # текущего конвейера у Kimi (3,35 против 3,22) и лучше у GLM (4,1 против 3,73); заметнее всего выросла
  # обоснованность (Kimi 2,83 → 3,33). Запасные модели — другие, чтобы сервис работал, если DeepSeek недоступен.
  # Независимость оценки сохраняется на уровне судей: GLM и Kimi в конвейере не участвуют.
  plan:               {model: deepseek, fallback: qwen}
  interpret:          {model: deepseek, fallback: glm}
  critique:           {model: deepseek, fallback: glm}
  revise:             {model: deepseek, fallback: glm}
  chat:               {model: qwen,     fallback: gemma}
  # «Деньги на кону»: модель решает, какие события реально двигают рычаги компании; суммы — калькулятор
  money_check:        {model: deepseek, fallback: qwen}
  judge:              {model: deepseek, fallback: glm}
