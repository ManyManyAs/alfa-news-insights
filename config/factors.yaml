  key_rate:
    title: Ключевая ставка и стоимость денег
    keywords: [ключевая ставка, ключевую ставку, ключевой ставки, ключевой ставке, дкп, денежно-кредитн, банк россии, цб рф, цб, набиуллин, ruonia, стоимость денег]
