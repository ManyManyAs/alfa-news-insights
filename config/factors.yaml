# Словарь макро- и отраслевых факторов.
# Один и тот же словарь используется:
#   1) классификатором новостей (какие факторы затрагивает событие);
#   2) матрицей чувствительности компаний (config/sensitivity.yaml);
#   3) тезисами позиции банка (data/knowledge/bank_theses.json).
# keywords нужны для детерминированного fallback-классификатора (без LLM): ключ — начало слова
# (совпадение с границы слова), например «инфляц» найдёт «инфляция», «инфляционные».
# LLM-классификатор возвращает id факторов из этого же списка.
# Новый фактор = новая запись здесь (масштабирование без правки кода).

