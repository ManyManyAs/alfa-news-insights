# Плейбук «фактор -> последствия -> действия -> продукты».
# Используется:
#   * как подсказки агенту (LLM) — какие каналы влияния проверить;
#   * как детерминированный fallback, если LLM недоступна (режим mock или исчерпан бюджет).
# Тексты — шаблоны: {company} заменяется описанием компании.
# products: product — название, when — условие (has:<признак> / lacks:<признак>), why — обоснование.

factors:
  key_rate:
    risk: "Деньги остаются дорогими дольше: процентная нагрузка по плавающим кредитам и стоимость рефинансирования не снизятся в ближайшие месяцы, инвестпроекты на заёмные средства становятся менее окупаемыми."
    opportunity: "Высокая ставка сохраняет доходность размещения свободной ликвидности на депозитах и в коротких инструментах."
    stable: "Ставка не меняется, но ожидавшееся удешевление кредитов откладывается — бюджет на обслуживание долга стоит пересчитать по более консервативному сценарию."
    drivers: ["Решение ЦБ на следующем заседании и сигнал регулятора", "Динамика устойчивой инфляции и инфляционных ожиданий", "Параметры бюджета и объём размещения ОФЗ"]
    actions:
      - {type: finance, text: "Пересчитать график процентных платежей по кредитам при сценарии «ставка на текущем уровне до конца года»"}
      - {type: hedge, text: "Оценить долю долга с плавающей ставкой и целесообразность фиксации ставки или процентного хеджа"}
      - {type: analysis, text: "Проверить окупаемость инвестпроектов на заёмных деньгах при более высокой ставке дисконтирования"}
    products:
      - {product: "Кредит с фиксированной ставкой / рефинансирование", when: "has:CL_PRODUCT_LOA_MARK", why: "Защищает от длительного периода высоких ставок"}
      - {product: "Депозит / неснижаемый остаток", when: "lacks:CL_PRODUCT_DEP_MARK", why: "Позволяет заработать на высокой ставке на свободной ликвидности"}
  credit_conditions:
    risk: "Ужесточение кредитных условий может ограничить доступ к оборотному финансированию и увеличить требования к залогам и ковенантам."
    opportunity: "Улучшение доступности кредита позволяет профинансировать рост и пополнить оборотный капитал."
    stable: "Условия кредитования без существенных изменений; важно заранее согласовать лимиты на пиковый сезон."
    drivers: ["Политика банков по риску", "Финансовое состояние заёмщиков", "Макропруденциальные меры ЦБ"]
    actions:
      - {type: finance, text: "Заранее согласовать кредитный лимит на оборотные нужды"}
      - {type: analysis, text: "Проверить ковенанты по действующим кредитам на запас прочности"}
    products:
      - {product: "Факторинг", when: "lacks:FACTORING_MARK", why: "Ускоряет оборачиваемость дебиторки без увеличения долговой нагрузки"}
  inflation:
    risk: "Рост цен увеличивает себестоимость (сырьё, топливо, услуги) и давит на маржу, если нет возможности переложить рост цен на покупателей."
    opportunity: "Ускорение инфляции может поддержать номинальную выручку компаниям с ценовой властью."
    stable: "Инфляция остаётся повышенной — её снижения в ближайшие месяцы ждать не стоит."
    drivers: ["Курс рубля", "Цены на топливо", "Рост зарплат"]
    actions:
      - {type: operations, text: "Пересмотреть прайс и условия индексации в договорах с покупателями"}
      - {type: operations, text: "Зафиксировать цены с ключевыми поставщиками на ближайшие кварталы"}
    products: []
  fx_rub:
    risk: "Ослабление рубля удорожает импортные закупки и валютные обязательства; укрепление снижает рублёвую выручку экспортёров."
    opportunity: "Движение курса может улучшить рублёвую выручку экспортёра или снизить стоимость импорта — в зависимости от позиции компании."
    stable: "Курс без резких изменений, но прогноз банка предполагает ослабление рубля к концу года."
    drivers: ["Цены на сырьё и экспортная выручка", "Импорт и спрос на валюту", "Ключевая ставка"]
    actions:
      - {type: hedge, text: "Оценить открытую валютную позицию (закупки/выручка в валюте на 3–6 месяцев)"}
      - {type: hedge, text: "Рассмотреть хеджирование части валютных платежей форвардом"}
      - {type: operations, text: "Проверить валютные оговорки в контрактах"}
    products:
      - {product: "Валютный форвард / хеджирование", when: "has:FTS_FLAG", why: "Фиксирует курс по будущим валютным платежам"}
      - {product: "Конверсия и ВЭД-сопровождение", when: "has:FTS_FLAG", why: "Сокращает издержки на расчёты с иностранными контрагентами"}
  china_trade:
    risk: "Изменения в расчётах с Китаем (курс юаня, банковские ограничения, комплаенс) могут задержать платежи и поставки."
    opportunity: "Новая инфраструктура расчётов в юанях может снизить риски заморозки средств и упростить расчёты с китайскими партнёрами."
    stable: "Каналы расчётов с Китаем работают; важно следить за курсом CNY и комиссиями."
    drivers: ["Курс CNY/RUB", "Платёжная инфраструктура", "Санкционные риски"]
    actions:
      - {type: operations, text: "Проверить, через какие банки и в какой валюте проходят платежи китайским контрагентам"}
      - {type: hedge, text: "Оценить хеджирование юаневых платежей"}
    products:
      - {product: "Расчёты в юанях и ВЭД-сопровождение", when: "has:FTS_FLAG", why: "Прямые расчёты в CNY с китайскими партнёрами"}
  sanctions_trade:
    risk: "Новые пошлины, санкции или ограничения меняют стоимость и сроки поставок, могут потребовать смены поставщиков и маршрутов."
    opportunity: "Защитные меры для локальных производителей могут улучшить позиции компании на внутреннем рынке."
    stable: "Режим внешней торговли не меняется; сохраняется риск новых ограничений."
    drivers: ["Решения правительства по пошлинам", "Вторичные санкции и платежи", "Логистические маршруты"]
    actions:
      - {type: analysis, text: "Оценить долю закупок из затронутых стран и альтернативных поставщиков"}
      - {type: operations, text: "Пересчитать себестоимость с учётом возможных пошлин"}
    products:
      - {product: "ВЭД-сопровождение и валютный контроль", when: "has:FTS_FLAG", why: "Помогает перестроить платёжные цепочки"}
  consumer_demand:
    risk: "Замедление потребительского спроса снижает продажи и оборачиваемость запасов, усиливает конкуренцию за покупателя."
    opportunity: "Сохранение высокого спроса позволяет наращивать продажи и пересматривать цены."
    stable: "Спрос стабилен, но банк ожидает охлаждения потребления в ближайшие кварталы."
    drivers: ["Реальные зарплаты", "Кредитование населения", "Инфляция"]
    actions:
      - {type: operations, text: "Скорректировать план закупок и запасов под сценарий охлаждения спроса"}
      - {type: analysis, text: "Проверить структуру продаж по категориям, наиболее чувствительным к спросу"}
    products:
      - {product: "Кредитная линия на оборотный капитал", when: "lacks:CL_PRODUCT_LOA_MARK", why: "Сглаживает сезонные колебания выручки"}
  labor_market:
    risk: "Дефицит персонала и рост зарплат увеличивают фонд оплаты труда и могут ограничить рост бизнеса."
    opportunity: "Охлаждение рынка труда облегчит найм и замедлит рост ФОТ."
    stable: "Ситуация на рынке труда остаётся напряжённой."
    drivers: ["Безработица", "Темпы роста зарплат", "Миграционная политика"]
    actions:
      - {type: finance, text: "Заложить в бюджет индексацию ФОТ в соответствии с рыночным ростом зарплат"}
      - {type: operations, text: "Оценить возможности автоматизации на участках с наибольшим дефицитом кадров"}
    products:
      - {product: "Зарплатный проект", when: "lacks:CL_PRODUCT_ZPP_MARK", why: "Инструмент удержания сотрудников без роста издержек"}
  bond_market:
    risk: "Рост доходностей ОФЗ повышает стоимость рыночного долгового финансирования и купон новых облигационных выпусков."
    opportunity: "Высокие доходности позволяют выгодно разместить ликвидность в облигациях."
    stable: "Долговой рынок без изменений; окно для размещений зависит от решений ЦБ и Минфина."
    drivers: ["Решения ЦБ", "Размещения Минфина", "Параметры бюджета"]
    actions:
      - {type: finance, text: "Если планируется выпуск облигаций — рассмотреть флоатер вместо фиксированного купона"}
    products: []
  budget_policy:
    risk: "Изменение бюджетных параметров (расходы, налоги, госзаказ) может сократить объём госконтрактов или увеличить налоговую нагрузку."
    opportunity: "Рост бюджетных расходов поддерживает спрос со стороны госзаказчиков."
    stable: "Бюджетная политика без изменений; ключевые параметры будут объявлены с бюджетным пакетом."
    drivers: ["Параметры федерального бюджета", "Налоговые изменения", "Госзакупки"]
    actions:
      - {type: analysis, text: "Оценить долю выручки, зависящую от госзаказа и бюджетных программ"}
    products:
      - {product: "Банковская гарантия для госконтрактов", when: "lacks:CL_PRODUCT_GAR_MARK", why: "Нужна для участия в госзакупках"}
  tax_regulation:
    risk: "Изменение налоговых правил или льгот может увеличить налоговую нагрузку и потребовать перестройки процессов."
    opportunity: "Новые льготы или упрощения могут снизить издержки."
    stable: "Регулирование без изменений, но обсуждаемые поправки стоит отслеживать."
    drivers: ["Законопроекты", "Позиция Минфина", "Бюджетный пакет"]
    actions:
      - {type: analysis, text: "Оценить эффект изменений на налоговую нагрузку компании вместе с главным бухгалтером"}
      - {type: monitor, text: "Отслеживать прохождение законопроекта и сроки вступления в силу"}
    products: []
  logistics:
    risk: "Рост стоимости и сроков перевозок увеличивает себестоимость и оборотный капитал в пути."
    opportunity: "Рост спроса на перевозки и складские услуги поддерживает выручку логистических компаний."
    stable: "Логистика без существенных изменений."
    drivers: ["Тарифы", "Топливо", "Пропускная способность маршрутов"]
    actions:
      - {type: operations, text: "Проверить альтернативные маршруты и перевозчиков"}
    products:
      - {product: "Лизинг транспорта", when: "lacks:CL_PRODUCT_LEA_MARK", why: "Обновление парка без единовременных затрат"}
  fuel:
    risk: "Рост цен на топливо увеличивает транспортные и производственные издержки."
    opportunity: "Рост цен на топливо поддерживает выручку производителей и продавцов топлива."
    stable: "Цены на топливо стабильны."
    drivers: ["Экспортные ограничения", "Налоговый манёвр и демпфер", "Сезонный спрос"]
    actions:
      - {type: finance, text: "Заложить рост топливных расходов в бюджет и тарифы"}
    products: []
  commodity_metals:
    risk: "Изменение цен на металлы меняет себестоимость для потребителей металла и выручку производителей."
    opportunity: "Снижение цен на прокат удешевляет закупки для металлообработки и строительства; рост цен поддерживает металлургов."
    stable: "Цены на металлы стабильны."
    drivers: ["Спрос стройки и машиностроения", "Экспортные цены", "Курс рубля"]
    actions:
      - {type: operations, text: "Пересмотреть сроки и объёмы закупок металла с учётом ценового тренда"}
    products: []
  gold:
    risk: "Снижение цен на золото уменьшает выручку золотодобытчиков."
    opportunity: "Рост цен на золото поддерживает выручку производителей и интерес к золоту как защитному активу."
    stable: "Цена на золото без резких изменений."
    drivers: ["Политика ФРС и доллар", "Покупки центробанков", "Спрос на ETF и в Азии"]
    actions:
      - {type: analysis, text: "Оценить влияние цены золота на выручку и долговую нагрузку"}
    products: []
  real_estate:
    risk: "Высокие ставки снижают оценку недвижимости и спрос на покупку; рост вакантности давит на арендные доходы."
    opportunity: "Дефицит качественных площадей поддерживает рост арендных ставок."
    stable: "Рынок недвижимости стабилен."
    drivers: ["Ключевая ставка", "Ввод новых площадей", "Деловая активность арендаторов"]
    actions:
      - {type: finance, text: "Пересмотреть арендные ставки и индексацию в договорах"}
    products: []
  construction:
    risk: "Дорогое проектное финансирование и охлаждение ипотеки сокращают новые стройки и спрос на подрядные работы."
    opportunity: "Снижение цен на стройматериалы и господдержка инфраструктуры улучшают экономику проектов."
    stable: "Стройотрасль работает в условиях дорогих денег."
    drivers: ["Ключевая ставка", "Ипотечные программы", "Цены на стройматериалы"]
    actions:
      - {type: analysis, text: "Пересчитать экономику проектов при сохранении высокой ставки"}
    products:
      - {product: "Банковская гарантия", when: "lacks:CL_PRODUCT_GAR_MARK", why: "Обеспечение по подрядным контрактам"}
  auto_market:
    risk: "Снижение продаж автомобилей бьёт по выручке дилеров, сервисов и лизинговых компаний."
    opportunity: "Снижение спроса может дать скидки при обновлении автопарка компании."
    stable: "Авторынок стабилен."
    drivers: ["Автокредитование", "Утильсбор", "Курс рубля"]
    actions:
      - {type: operations, text: "Оценить сроки обновления автопарка с учётом цен и скидок"}
    products:
      - {product: "Лизинг автотранспорта", when: "lacks:CL_PRODUCT_LEA_MARK", why: "Обновление автопарка без отвлечения оборотных средств"}
  agriculture:
    risk: "Снижение цен на продукцию или проблемы с экспортом урожая сокращают выручку аграриев."
    opportunity: "Удешевление сырья снижает себестоимость пищевых производителей."
    stable: "Аграрный рынок стабилен."
    drivers: ["Урожай", "Экспортные пошлины и квоты", "Погода"]
    actions:
      - {type: operations, text: "Пересмотреть сроки закупок сырья с учётом ценового тренда"}
    products: []
  it_tech:
    risk: "Изменения регулирования и льгот для IT могут повысить налоговую нагрузку и ФОТ."
    opportunity: "Господдержка импортозамещения расширяет спрос на отечественное ПО."
    stable: "Регулирование IT-отрасли без изменений."
    drivers: ["IT-льготы", "Госзаказ на импортозамещение", "Рынок труда разработчиков"]
    actions:
      - {type: analysis, text: "Оценить влияние изменения льгот на ФОТ и налог на прибыль"}
    products: []
  geopolitics:
    risk: "Рост геополитической неопределённости повышает волатильность рынков и курса."
    opportunity: "Позитивные изменения в геополитике могут снизить премию за риск и стоимость денег."
    stable: "Геополитический фон без изменений."
    drivers: ["Переговоры", "Санкции", "Настроения инвесторов"]
    actions:
      - {type: monitor, text: "Подготовить стресс-сценарий по курсу и ставкам"}
    products: []
  commodity_oil:
    risk: "Снижение цен на нефть ослабляет рубль и бюджет, снижает выручку нефтяного сектора."
    opportunity: "Рост цен на нефть поддерживает экспортную выручку и рубль."
    stable: "Нефтяные цены стабильны."
    drivers: ["ОПЕК+", "Дисконт Urals", "Мировой спрос"]
    actions:
      - {type: analysis, text: "Оценить чувствительность выручки к цене нефти"}
    products: []
