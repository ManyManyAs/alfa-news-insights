name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.8.4"
          src: backend
      - name: actionlint (проверка workflow)
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.4/scripts/download-actionlint.bash) 1.7.4
          ./actionlint -color

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock
      - run: python -m pytest -q
      - name: Офлайн-метрики и проверка качества против main
        env:
          DATA_SOURCE_DIR: ../data/sample
          DB_PATH: /tmp/eval-sample.db
          LLM_MODE: mock
          USE_SNAPSHOT: "false"
        run: |
          python scripts/evaluate.py --insights --json /tmp/quality.json | grep -v WARNING
          set +e
          python scripts/quality_gate.py /tmp/quality.json ../docs/quality/baseline.json --md /tmp/quality.md
          echo "GATE=$?" >> "$GITHUB_ENV"
          set -e
          cat /tmp/quality.md >> "$GITHUB_STEP_SUMMARY"
      - name: Комментарий с метриками в PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          { echo '<!-- quality-gate -->'; cat /tmp/quality.md; } > /tmp/comment.md
          ID=$(gh api "repos/$REPO/issues/$PR/comments" --jq '[.[] | select(.body | startswith("<!-- quality-gate -->"))][0].id // empty')
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@/tmp/comment.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@/tmp/comment.md > /dev/null
          fi
      - name: Регрессия качества блокирует PR
        run: test "$GATE" = "0" || { echo "::error::Офлайн-метрики упали больше допуска — см. комментарий к PR"; exit 1; }
      - name: Smoke на данных кейса (85 тыс. компаний)
        env:
          DATA_SOURCE_DIR: ../data/case
          DB_PATH: /tmp/case.db
          LLM_MODE: auto
        run: python -c "from app.bootstrap import bootstrap; s=bootstrap(); print(s); assert s['companies'] > 80000"

  lock:
    # uv.lock генерируется в CI (в песочнице разработки нет доступа к PyPI) и коммитится в ветку
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd backend && uv lock
      - name: Commit uv.lock if changed
        run: |
          if [ -n "$(git status --porcelain backend/uv.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/uv.lock
            git commit -m "chore: обновить backend/uv.lock"
            git push
          fi

  nginx:
    # Конфиг Nginx стенда (HTTP и HTTPS) проверяется «nginx -t» на версиях из Ubuntu 22.04 / 24.04 и свежей
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["nginx:1.18", "nginx:1.24", "nginx:1.27"]
    steps:
      - uses: actions/checkout@v4
      - name: nginx -t для HTTP и HTTPS
        run: |
          D=test.sslip.io
          mkdir -p /tmp/ng/le/live/$D
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=$D" \
            -keyout /tmp/ng/le/live/$D/privkey.pem -out /tmp/ng/le/live/$D/fullchain.pem 2>/dev/null
          python3 deploy/render_nginx.py > /tmp/ng/http.conf
          python3 deploy/render_nginx.py "$D" > /tmp/ng/https.conf
          for conf in http https; do
            docker run --rm -v /tmp/ng/$conf.conf:/etc/nginx/conf.d/default.conf:ro \
              -v "$PWD/deploy/nginx-app.conf:/etc/nginx/snippets/alfa-radar-app.conf:ro" \
              -v /tmp/ng/le:/etc/letsencrypt:ro ${{ matrix.image }} nginx -t
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Запуск контейнера и health-check
        run: |
          docker compose up -d app
          for _ in $(seq 1 60); do curl -sf localhost:8000/api/health && break; sleep 3; done
          curl -sf localhost:8000/api/health
          curl -sf localhost:8000/api/demo-users | head -c 300
          # вход демо-пользователя: без сессии данные закрыты, с сессией (cookie) — доступны
          LOGIN=$(curl -sf localhost:8000/api/demo-users | python3 -c "import json,sys; print(json.load(sys.stdin)['users'][0]['user_id'])")
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/me)" = "401"
          curl -sf -c cookies.txt -H 'Content-Type: application/json' -d "{\"login\": \"$LOGIN\", \"password\": \"alfa2026\"}" localhost:8000/api/auth/login
          curl -sf -b cookies.txt localhost:8000/api/me | head -c 300
          curl -sI localhost:8000/ | grep -i content-security-policy
          docker compose logs app | tail -20
