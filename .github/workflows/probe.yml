name: Stand probe

# Быстрый снимок состояния стенда для команды и агентов (из их песочницы стенд недоступен):
# скорость разборов, стоимость, бюджет моделей, источники. Итоги — аннотациями запуска и в summary.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
    steps:
      - name: Метрики стенда
        run: |
          if [ -z "$DOMAIN" ] && [[ "$HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then DOMAIN="${HOST//./-}.sslip.io"; fi
          BASE="https://${DOMAIN:-77-221-139-69.sslip.io}"
          JAR="$(mktemp)"
          LOGIN="$(curl -sf "$BASE/api/demo-users" | python3 -c 'import json,sys; print(json.load(sys.stdin)["users"][0]["user_id"])')"
          curl -sf -c "$JAR" -H 'Content-Type: application/json' -d "{\"login\": \"$LOGIN\", \"password\": \"alfa2026\"}" "$BASE/api/auth/login" >/dev/null
          for d in 1 7; do curl -sf -b "$JAR" "$BASE/api/metrics?days=$d" > "m$d.json"; done
          curl -sf -b "$JAR" "$BASE/api/llm/budget" > budget.json || echo '{}' > budget.json
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          for d in (1, 7):
              m = json.load(open(f"m{d}.json"))
              sp = m["product"]["speed_ms"]
              print(f"::notice title=Скорость за {d} д, мс::{json.dumps(sp, ensure_ascii=False)}")
              print(f"::notice title=Стоимость разбора за {d} д::{json.dumps(m.get('cost'), ensure_ascii=False)[:400]}")
              print(f"::notice title=Алерты за {d} д::{json.dumps(m.get('alerts'), ensure_ascii=False)[:800]}")
              print(f"::notice title=Продукт за {d} д::{json.dumps(m['product'].get('rates'), ensure_ascii=False)[:600]}")
          m = json.load(open("m1.json"))
          llm = {k: m["llm"].get(k) for k in ("mode", "spent_rub", "budget_rub", "left_rub", "source")}
          print(f"::notice title=Модели сегодня::{json.dumps(llm, ensure_ascii=False)} · живых в топ-10: {json.dumps(m.get('live_share'), ensure_ascii=False)[:200]}")
          print(f"::notice title=Судья (критик)::{json.dumps(m['insights'], ensure_ascii=False)[:400]}")
          EOF
      - name: Лента и «деньги на кону» по демо-персонам
        run: |
          if [ -z "$DOMAIN" ] && [[ "$HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then DOMAIN="${HOST//./-}.sslip.io"; fi
          BASE="https://${DOMAIN:-77-221-139-69.sslip.io}"
          curl -sf "$BASE/api/demo-users" > users.json
          python3 - "$BASE" <<'EOF'
          import json, sys, http.cookiejar, urllib.request
          base = sys.argv[1]
          for u in json.load(open("users.json"))["users"]:
              jar = http.cookiejar.CookieJar()
              op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
              req = urllib.request.Request(f"{base}/api/auth/login", data=json.dumps({"login": u["user_id"], "password": "alfa2026"}).encode(),
                                           headers={"Content-Type": "application/json"})
              op.open(req, timeout=30).read()
              q = f"company_id={u['primary_company']}&role={u['role']}"
              feed = json.load(op.open(f"{base}/api/feed?{q}&limit=50", timeout=60))
              items = feed.get("items", feed if isinstance(feed, list) else [])
              m = json.load(op.open(f"{base}/api/money?{q}", timeout=120))
              live = sum(1 for i in items if (i.get("trust") or "") != "demo")
              print(f"::notice title=Персона {u['label'][:30]}::лента {len(items)} (живых {live}); деньги: рычагов {len(m.get('levers', []))}, "
                    f"событий {m.get('events_used')} из {m.get('candidates')}, ИИ {json.dumps(m.get('ai'), ensure_ascii=False)[:160]}, "
                    f"пересмотров {len(m.get('revisions', []))}; отсеяно: "
                    + " | ".join(f"{r['lever']}: {r['title'][:60]} — {r['why'][:110]}" for r in m.get("rejected", [])[:3]))
          EOF
