# Общая часть сервера «Бизнес-радара»: подключается и в HTTP-, и в HTTPS-блок (install.sh кладёт её в /etc/nginx/snippets/).
# Сжатие, стриминг (SSE) без буферизации, лимиты запросов к LLM-эндпоинтам по IP, заголовки безопасности.
client_max_body_size 2m;
server_tokens off;

gzip on;
gzip_types text/css text/javascript application/javascript application/json text/plain image/svg+xml font/woff;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Потоковые ответы агента и чата (SSE): без буферизации, длинный таймаут, отдельный лимит (тратят бюджет LLM)
location ~ ^/api/(insights/.+/stream|chat/stream|chat|news/analyze)$ {
    limit_req zone=radar_llm burst=10 nodelay;
    proxy_pass http://radar_app;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    add_header X-Accel-Buffering no;
}

location /api/ {
    limit_req zone=radar_api burst=40 nodelay;
    proxy_pass http://radar_app;
    proxy_read_timeout 300s;
}

location /static/ {
    proxy_pass http://radar_app;
    expires 1h;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff always;
}

location / {
    proxy_pass http://radar_app;
}
