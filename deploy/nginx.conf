# Nginx на хосте перед контейнером. install.sh собирает из этого шаблона рабочий конфиг: подставляет тело
# HTTP-сервера (само приложение или перенаправление на HTTPS) и сервер на 443 с сертификатом Let's Encrypt.
limit_req_zone $binary_remote_addr zone=radar_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=radar_llm:10m rate=30r/m;

upstream radar_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # проверка домена для Let's Encrypt (выпуск и продление сертификата)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

__HTTP_BODY__
}
__HTTPS__
