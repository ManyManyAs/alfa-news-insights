# Nginx на хосте перед контейнером (install.sh подставляет __SERVER_NAME__ и кладёт файл в sites-available).
# Сжатие, стриминг (SSE) без буферизации, лимиты запросов к LLM-эндпоинтам, заголовки безопасности.
limit_req_zone $binary_remote_addr zone=radar_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=radar_llm:10m rate=30r/m;

upstream radar_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAME__;

    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Потоковые ответы агента и чата (SSE): без буферизации, длинный таймаут, отдельный лимит (тратят бюджет LLM)
    location ~ ^/api/(insights/.+/stream|chat/stream|chat|news/analyze)$ {
        limit_req zone=radar_llm burst=10 nodelay;
        proxy_pass http://radar_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        limit_req zone=radar_api burst=40 nodelay;
        proxy_pass http://radar_app;
        proxy_read_timeout 300s;
    }

    location /static/ {
        proxy_pass http://radar_app;
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://radar_app;
    }
}
